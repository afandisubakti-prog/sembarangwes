<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>App</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#000; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #track {
    height:100%;
    width:800%;
    display:flex;
    transition: transform 0.25s ease-out;
  }
  .page { height:100%; width:12.5%; overflow:hidden; }
  .p3 { background:#F5C400; }
  .p4 { background:#2F9E44; }
  .p5 { background:#111111; }
  .p6 { background:#FFFFFF; }
  .p7 { background:#9AA5AD; }
  .p8 { background:#111111; }

  /* Halaman 1: Menu Utama */
  .p1 {
    background:#F2F4F7;
    display:flex;
    flex-direction:column;
  }
  .p1 .topbar {
    height:64px;
    background:#FFFFFF;
    border-bottom:1px solid #E2E6EA;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .p1 .topbar span {
    font-size:1.05rem;
    font-weight:700;
    color:#1B1F23;
  }
  .p1 .list {
    flex:1;
    overflow-y:auto;
    padding:14px 14px 24px;
  }
  .menu-item {
    display:flex;
    align-items:center;
    padding:16px 16px;
    margin-bottom:12px;
    border-radius:14px;
    background:#2196F3;
    box-shadow:0 2px 6px rgba(33,150,243,0.25);
  }
  .menu-item .icon {
    width:42px;
    height:42px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:14px;
  }
  .menu-item .icon svg { width:28px; height:28px; }
  .menu-item .name {
    color:#FFFFFF;
    font-size:1.0rem;
    font-weight:700;
    line-height:1.25;
  }
  .menu-item .sub {
    color:rgba(255,255,255,0.85);
    font-size:0.85rem;
    font-weight:500;
    margin-top:2px;
  }
</style>
</head>
<body>
  <div id="track">
    <div class="page p1">
      <div class="topbar"><span>Data Sentral</span></div>
      <div class="list">

        <div class="menu-item" onclick="goTo(1)">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M3 21V10l6 3V10l6 3V10l6 3v8H3z"/><path d="M3 21h18"/></svg></div>
          <div><div class="name">Coal Handling Facility</div><div class="sub">PKU : 95%</div></div>
        </div>

        <div class="menu-item" onclick="goTo(2)">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M3 12h9a3 3 0 100-6H8"/><path d="M3 17h13a3 3 0 110 6"/></svg></div>
          <div><div class="name">Ash Handling Facility</div><div class="sub">PKU : 89%</div></div>
        </div>

        <div class="menu-item" onclick="goTo(3)">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="13" r="7"/><path d="M12 13l3-2M9 5h6M12 5V3"/></svg></div>
          <div><div class="name">Compressor</div><div class="sub">PKU : 92%</div></div>
        </div>

        <div class="menu-item" onclick="goTo(4)">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M3 6l6-2 6 2 6-2v16l-6 2-6-2-6 2V6z"/><path d="M9 4v16M15 6v16"/></svg></div>
          <div><div class="name">Peta Coalyard</div><div class="sub">Real-Time Coalyard Monitoring</div></div>
        </div>

        <div class="menu-item" onclick="goTo(5)">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M3 19l2-8h14l2 8H3z"/><path d="M6 11V7a2 2 0 012-2h2M12 3v4"/></svg></div>
          <div><div class="name">Line-Up Tongkang</div><div class="sub">Status &amp; Progres Pembongkaran</div></div>
        </div>

        <div class="menu-item" onclick="goTo(6)">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
          <div><div class="name">Pola Loading</div><div class="sub">Komposisi Batubara Bunker</div></div>
        </div>

        <div class="menu-item" onclick="goTo(7)">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 17v.01"/></svg></div>
          <div><div class="name">Ketidaknormalan Peralatan</div><div class="sub">Monitoring Kondisi Peralatan</div></div>
        </div>

      </div>
    </div>
    <div class="page p2" style="background:#F5C400;"></div>
    <div class="page p3"></div>
    <div class="page p4"></div>
    <div class="page p5"></div>
    <div class="page p6"></div>
    <div class="page p7"></div>
    <div class="page p8"></div>
  </div>
  <script>
    var track = document.getElementById('track');
    var total = 8;
    var current = 0;
    var startX = 0;
    var dx = 0;
    var w = window.innerWidth;

    function goTo(n) {
      current = n;
      render(true);
    }

    function render(withTransition) {
      track.style.transition = withTransition ? 'transform 0.25s ease-out' : 'none';
      track.style.transform = 'translateX(' + (-current * w) + 'px)';
    }

    window.addEventListener('resize', function() {
      w = window.innerWidth;
      render(false);
    });

    document.addEventListener('touchstart', function(e) {
      startX = e.touches[0].clientX;
      dx = 0;
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
      dx = e.touches[0].clientX - startX;
      track.style.transition = 'none';
      track.style.transform = 'translateX(' + (-current * w + dx) + 'px)';
    }, { passive: true });

    document.addEventListener('touchend', function() {
      var threshold = w * 0.15;
      if (dx < -threshold && current < total - 1) {
        current++;
      } else if (dx > threshold && current > 0) {
        current--;
      }
      render(true);
    });

    render(false);
  </script>
</body>
</html>
