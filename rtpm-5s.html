<title>Jadwal RTPM & 5S</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#161A22; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }

  #scrollArea { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .wrap { padding:16px 14px 90px; }

  .date-label { color:#8890A0; font-size:0.78rem; font-weight:600; margin-bottom:14px; text-align:center; }
  .date-label .now-tag { color:#FACC15; font-weight:800; margin-left:6px; }

  .section-title {
    color:#5EEAD4;
    font-weight:800;
    font-size:0.92rem;
    letter-spacing:0.04em;
    margin:18px 2px 8px;
  }
  .section-title.first { margin-top:0; }

  .item-card {
    border-radius:14px;
    padding:13px 15px;
    margin-bottom:10px;
    color:#fff;
    font-weight:700;
    font-size:0.86rem;
    line-height:1.35;
  }
  .item-card.rtpm { background:linear-gradient(135deg, #29A0F0, #1362C4); box-shadow:0 4px 12px rgba(19,98,196,0.3); }
  .item-card.fives { background:linear-gradient(135deg, #FBBF24, #D97706); box-shadow:0 4px 12px rgba(217,119,6,0.3); }
  .item-card.dash { background:#212635; border:1px solid #2C3244; color:#7C8494; text-align:center; box-shadow:none; }

  .note {
    margin-top:16px;
    padding:12px 14px;
    background:#212635;
    border:1px solid #2C3244;
    border-radius:14px;
    color:#9AA5B4;
    font-size:0.76rem;
    line-height:1.5;
  }
  .note b { color:#D8DCE3; }

  .empty { text-align:center; color:#7C8494; font-size:0.86rem; padding:60px 20px; }

  /* Navigasi tanggal */
  .nav-btn {
    position:fixed;
    bottom:calc(max(16px, env(safe-area-inset-bottom)) + 6px);
    width:42px; height:42px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, background .15s ease;
    z-index:5;
  }
  .nav-btn:active { transform:scale(0.9); background:rgba(255,255,255,0.18); }
  .nav-btn svg { width:19px; height:19px; }
  #prevBtn { left:14px; }
  #nextBtn { right:14px; }
</style>

    var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

    var today = new Date();

    function dateKey(d) { return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
    function dateLabel(d) { return HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); }
    function isToday(d) { return dateKey(d) === dateKey(today); }

    function itemsBlock(items, cls) {
      if (!items || items.length === 0) {
        return '<div class="item-card dash">–</div>';
      }
      var html = '';
      items.forEach(function(t, i) {
        html += '<div class="item-card ' + cls + '">' + (i+1) + '. ' + t + '</div>';

      return html;

        html += '<div class="section-title">5S</div>';
        html += itemsBlock(fivesItems, 'fives');
        html += '<div class="note"><b>Catatan:</b> Setelah melakukan RTPM agar mengisi Google Form yang sudah tersedia, dan membuat SR FLM untuk aktivitas 5S.</div>';
      }
      document.getElementById('content').innerHTML = html;
      document.getElementById('scrollArea').scrollTop = 0;
    }

    function goDay(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      render();
    }

    render();
  </script>
</body>
</html>
